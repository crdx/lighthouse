<div class="a5eab416-b1c5-4f51-9feb-dccf69eccd64">
    <svg class="fa-spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <path d="M304 48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zm0 416a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM48 304a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm464-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM142.9 437A48 48 0 1 0 75 369.1 48 48 0 1 0 142.9 437zm0-294.2A48 48 0 1 0 75 75a48 48 0 1 0 67.9 67.9zM369.1 437A48 48 0 1 0 437 369.1 48 48 0 1 0 369.1 437z"/>
    </svg>

<script type="text/javascript">
    const bootID = '{{ liveReloadBootID }}'

    let navigating = false
    let controller = null

    window.onbeforeunload = function() {
        navigating = true
        return null
    };

    (async function() {
        async function sleep(n) {
            return new Promise(resolve => setTimeout(resolve, n))
        }

        async function waitUntilHealthy() {
            // Limit how long we'll wait for the server to come back.
            const maxSeconds = 60

            const delayMilliseconds = 250
            const iterations = maxSeconds * (1000 / delayMilliseconds)

            for (var i = 0; i < iterations; i++) {
                try {
                    let res = await fetch('/-/health')
                    if (res.status == 200) {
                        break
                    }
                } catch {}
                await sleep(delayMilliseconds)
            }
        }

        async function getBootID() {
            try {
                let res = await fetch('/-/boot')
                return res.status == 200 ? await res.text() : null
            } catch {
                return null
            }
        }

        async function reload() {
            document.querySelector('.a5eab416-b1c5-4f51-9feb-dccf69eccd64').style.display = 'grid'
            document.title = '(...) ' + document.title
            await waitUntilHealthy()
            document.location.reload()
        }

        async function watch() {
            controller = new AbortController()

            try {
                await fetch('/hang', { signal: controller.signal })
            } catch (error) {
                if (error.name == 'AbortError') {
                    return
                }
            }

            if (navigating || document.hidden) {
                return
            }

            await reload()
        }

        document.addEventListener('visibilitychange', async function() {
            if (document.hidden) {
                controller?.abort()
                return
            }

            if (await getBootID() != bootID) {
                await reload()
                return
            }

            watch()
        })

        if (!document.hidden) {
            watch()
        }
    })()
</script>
