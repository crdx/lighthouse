<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{ template "layout/p/theme" . }}

    <link rel="icon" href="{{ asset "favicon/light.svg" }}" media="(prefers-color-scheme: light)">
    <link rel="icon" href="{{ asset "favicon/dark.svg" }}" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="{{ asset "fontawesome/css/all.min.css" }}">
    <link rel="stylesheet" href="{{ asset "fonts.css" }}">
    <link rel="stylesheet" href="{{ asset "bulma.min.css" }}">
    <link rel="stylesheet" href="{{ asset "main.css" }}">

    <title>lighthouse</title>
    <style type="text/css">
        .constrained {
            max-width: 250px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    {{ embed }}

    {{ if enableLiveReload }}
        {{ template "layout/p/livereload" }}
    {{ end }}
</body>
</html>
