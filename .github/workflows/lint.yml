name: Lint

on:
  push:

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      # sqlc and the starfield plugin it loads, which `go generate` needs to write db/*.gen.go.
      # starfield is held at the version the author's machines build, so the generated code CI
      # lints is the generated code they have.
      - name: Install code generators
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install crdx.org/starfield/cmd/starfield@v1.12.0
      - run: go generate
      - uses: golangci/golangci-lint-action@1481404843c368bc19ca9406f87d6e0fc97bdcfd # v7.0.0
        with:
          version: latest
