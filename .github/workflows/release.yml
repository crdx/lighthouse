name: release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      runner: ubuntu-latest
                    - goos: linux
                      goarch: arm64
                      runner: ubuntu-24.04-arm

        runs-on: ${{ matrix.runner }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libpcap-dev

            - name: Install code generators
              run: |
                  go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
                  go install crdx.org/starfield/cmd/starfield@v1.14.0

            - name: Generate database code
              run: go generate

            - name: Build binaries
              env:
                  TARGET_ARCH: ${{ matrix.goarch }}
                  TARGET_OS: ${{ matrix.goos }}
              run: |
                  mkdir build
                  CGO_ENABLED=1 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -ldflags '-s -w' -o "build/lighthouse" ./cmd/lighthouse

                  ARCHIVE="lighthouse_${TARGET_OS}_${TARGET_ARCH}"
                  tar czf "${ARCHIVE}.tar.gz" -C build .

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ github.event.repository.name }}-${{ matrix.goos }}-${{ matrix.goarch }}
                  path: |
                      *.tar.gz

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  merge-multiple: true

            - name: Install just
              run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.58.0 --to /usr/local/bin

            - name: Extract changelog
              id: changelog
              run: |
                  BODY=$(just release::notes "${GITHUB_REF_NAME}")
                  {
                      echo "body<<EOF"
                      echo "$BODY"
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Create release
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  shopt -s nullglob
                  ASSETS=(*.tar.gz)
                  gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes "$BODY" --latest
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BODY: ${{ steps.changelog.outputs.body }}
